name: Import published writing

# Fetches the feeds configured in plot.yml and imports any new posts into
# published/. Because pushes made with GITHUB_TOKEN don't trigger other
# workflows, this also rebuilds generated/ so the indexes stay current.

on:
  schedule:
    - cron: "23 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:published
      - run: npm run build:indexes
      - name: Commit if changed
        run: |
          git add published/ generated/
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: import published writing"
            git push
          fi
